<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bodobodo · 구독을 취소합니다."><title>구독 취소 · Bodobodo · TwoWayStudio</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><a class="brand" href="/"><img src="TwoWayStudio_Logo.png" alt=""><span>TwoWayStudio</span></a><nav class="site-nav" aria-label="주요 메뉴"><a href="/">Home</a><a href="mailto:twowaystudio56@gmail.com">Contact</a></nav></header>
<main class="page"><article class="document">
<p class="eyebrow">Bodobodo · 보도자료 다이제스트</p>
<h1>구독 취소</h1>
<p class="lead" id="lead-text">아래 버튼을 누르면 <strong id="email-display"></strong> 주소의 구독이 취소됩니다.</p>

<div class="subscribe-form">
  <button type="button" id="confirm-btn">예, 구독 취소</button>
  <p id="form-message" class="form-message" role="status"></p>
</div>

<p class="hint" id="no-email-hint" hidden>구독 취소 링크에 이메일 정보가 없습니다. 받으신 메일 하단의 "구독 취소" 링크를 다시 눌러주시거나, <a href="mailto:twowaystudio56@gmail.com">twowaystudio56@gmail.com</a>으로 알려주세요.</p>

<script>
  // 왜 여기서 Apps Script(script.google.com)로 바로 이동하지 않고 이 페이지를
  // 거치는가: script.google.com/.../exec 링크를 브라우저 주소창/클릭으로 직접 열면
  // (=페이지 전체 이동) 그 브라우저에 구글 계정이 여러 개 로그인돼 있을 때, 구글이
  // 이 요청을 "스크립트 실행"이 아니라 "드라이브 파일 열기"로 잘못 처리해서
  // "현재 파일을 열 수 없습니다" 오류가 나는 경우가 있다(Apps Script 프로젝트가
  // 내부적으로는 드라이브 파일이라서 생기는 문제). fetch()로 호출하면 이 문제를
  // 겪지 않는다 — press-digest.html/press-digest-edit.html의 폼 제출과 같은 이유.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwreTLxf04jkjcBzEqwqPuT2FAJxahKXcpoHLc3ybjSpOzo1xKlc4ioUx6ZTLaEaz2-/exec';

  const btn = document.getElementById('confirm-btn');
  const msg = document.getElementById('form-message');
  const emailDisplay = document.getElementById('email-display');
  const leadText = document.getElementById('lead-text');
  const noEmailHint = document.getElementById('no-email-hint');

  const params = new URLSearchParams(window.location.search);
  const email = (params.get('email') || '').trim().toLowerCase();

  if (!email || email.indexOf('@') === -1) {
    leadText.hidden = true;
    btn.hidden = true;
    noEmailHint.hidden = false;
  } else {
    emailDisplay.textContent = email;
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    btn.textContent = '처리 중…';
    msg.className = 'form-message';

    const body = new URLSearchParams({ action: 'unsubscribe_confirm', email: email });
    fetch(APPS_SCRIPT_URL, { method: 'POST', body: body })
      .then(function (res) { return res.text(); })
      .then(function (text) {
        if (text === 'ok' || text === 'not_found') {
          leadText.textContent = text === 'ok'
            ? '구독이 취소되었습니다. 그동안 구독해주셔서 감사합니다.'
            : '이미 구독이 취소되었거나, 등록되지 않은 이메일입니다.';
          btn.hidden = true;
        } else {
          throw new Error('unexpected response');
        }
      })
      .catch(function () {
        msg.textContent = '처리 중 문제가 생겼습니다. 잠시 후 다시 시도해주시거나, twowaystudio56@gmail.com으로 알려주세요.';
        msg.className = 'form-message show error';
        btn.disabled = false;
        btn.textContent = '예, 구독 취소';
      });
  });
</script>
</article></main>
